# O plano gratuito do Supabase pausa o projeto após ~7 dias sem uso.
# Esta tarefa faz uma leitura simples na tabela de vagas a cada 3 dias
# para manter o banco ativo. Se falhar, o GitHub manda e-mail avisando.
name: Manter Supabase ativo

on:
  schedule:
    - cron: "0 12 */3 * *" # a cada 3 dias, às 9h (horário de Brasília)
  workflow_dispatch: # permite rodar manualmente pela aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Consultar a tabela de vagas
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          status=$(curl -s -o /dev/null -w "%{http_code}" \
            "$SUPABASE_URL/rest/v1/jobs?select=id&limit=1" \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY")
          echo "Resposta do Supabase: HTTP $status"
          if [ "$status" != "200" ]; then
            echo "::error::Supabase não respondeu como esperado (HTTP $status). Confira se o projeto foi pausado."
            exit 1
          fi
